<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Kuala Lumpur & Singapore must-eat food guide">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KUL SG Food">
<meta name="theme-color" content="#14110f">
<title>KUL · SG Food Guide</title>
<style>
:root{--bg:#14110f;--card:#1f1a17;--text:#f4ece4;--mute:#a89b90;--accent:#ff8a3d;--kul:#ffb703;--sg:#ef476f;--both:#4cc9a6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:rgba(20,17,15,.92);backdrop-filter:blur(12px);padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;border-bottom:1px solid #2c2622}
h1{margin:0 0 10px;font-size:20px}
h1 span{color:var(--accent)}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #3a322d;background:var(--card);color:var(--text);font-size:16px;outline:none}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid #3a322d;background:var(--card);color:var(--text);font-size:14px}
.chip.on{background:var(--accent);color:#1a1008;border-color:var(--accent);font-weight:600}
main{padding:12px 14px 40px;display:grid;gap:12px}
.count{color:var(--mute);font-size:13px;padding:0 2px}
.card{background:var(--card);border-radius:16px;padding:14px 16px;border-left:5px solid var(--both)}
.card.kul{border-color:var(--kul)}.card.sg{border-color:var(--sg)}
.en{font-size:18px;font-weight:700}
.zh{color:var(--accent);margin-top:2px;font-size:15px}
.tags{margin:8px 0;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:3px 9px;border-radius:999px;background:#2d2621;color:var(--mute)}
.note{font-size:15px;line-height:1.55;color:#d8cdc3}
</style>
</head>
<body>
<header>
  <h1>🍜 <span>KUL</span> · <span>SG</span> Food Guide</h1>
  <input id="q" type="search" placeholder="搜尋 Search…" autocomplete="off">
  <div class="chips" id="chips"></div>
</header>
<main>
  <div class="count" id="count"></div>
  <div id="list" style="display:grid;gap:12px"></div>
</main>
<script>
const FILTERS=[["all","全部 All"],["kul","吉隆坡 KL"],["sg","新加坡 SG"],["both","兩地皆有 Both"]];
let rows=[],f="all";
const $=id=>document.getElementById(id);
const region=p=>p.includes("兩地")?"both":p.includes("吉隆坡")?"kul":"sg";
function render(){
  const q=$("q").value.trim().toLowerCase();
  const out=rows.filter(r=>(f==="all"||r.region===f)&&(!q||r.all.includes(q)));
  $("count").textContent=out.length+" items";
  $("list").innerHTML=out.map(r=>`<article class="card ${r.region}">
    <div class="en">${r.en}</div><div class="zh">${r.zh}</div>
    <div class="tags"><span class="tag">${r.cat}</span><span class="tag">📍 ${r.place}</span></div>
    <div class="note">${r.note}</div></article>`).join("");
}
$("chips").innerHTML=FILTERS.map(([k,l])=>`<button class="chip${k==="all"?" on":""}" data-k="${k}">${l}</button>`).join("");
$("chips").onclick=e=>{const k=e.target.dataset.k;if(!k)return;f=k;
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.k===k));render();};
$("q").oninput=render;
fetch("Food%20List.tsv").then(r=>r.text()).then(t=>{
  const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  rows=t.trim().split(/\r?\n/).slice(1).map(l=>{
    const [en,zh,cat,place,note=""]=l.split("\t").map(s=>esc(s.trim()));
    return {en,zh,cat,place,note,region:region(place),all:(en+zh+cat+place+note).toLowerCase()};
  });
  render();
}).catch(()=>{$("count").textContent="Failed to load data"});
</script>
</body>
</html>
